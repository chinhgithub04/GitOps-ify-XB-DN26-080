apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maildev
  template:
    metadata:
      labels:
        app: maildev
    spec:
      containers:
      - name: maildev
        image: maildev/maildev:2.1.0
        ports:
        - name: smtp
          containerPort: 1025
        - name: web
          containerPort: 1080
---
apiVersion: v1
kind: Service
metadata:
  name: maildev
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: maildev
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
  - name: web
    port: 1080
    targetPort: 1080
